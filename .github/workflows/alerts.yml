# 盤中每 30 分鐘檢查一次，建議改變時推播到手機（ntfy）
# 需要在 GitHub repo 的 Settings → Secrets and variables → Actions 設定：
#   NTFY_TOPIC  手機 ntfy app 訂閱的主題名稱
#   HOLDINGS    持股代號，逗號分隔，例如 2330,NVDA
#   WATCHLIST   觀察清單代號，逗號分隔（選填）
name: Stock alerts

on:
  schedule:
    - cron: "*/30 1-5 * * 1-5"    # 台股盤中（台北 09:00–13:30）
    - cron: "*/30 13-20 * * 1-5"  # 美股盤中（約台北 21:30–04:00）
  workflow_dispatch:              # 也可以在 Actions 頁面手動執行

concurrency:
  group: stock-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore last state
        uses: actions/cache/restore@v4
        with:
          path: alert_state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-
      - name: Check stocks and notify
        run: python alerts.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HOLDINGS: ${{ secrets.HOLDINGS }}
          WATCHLIST: ${{ secrets.WATCHLIST }}
          SITE_URL: https://stock-radar-aaez.onrender.com
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: alert_state.json
          key: alert-state-${{ github.run_id }}
